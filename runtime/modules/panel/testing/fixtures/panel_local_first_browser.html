		async function registerDevice(registration){var now=Date.now(),credential={type:"panel_local_first_device_credential",schema_version:1,api_version:1,version:1,credential_id:"",actor_id:"Browser:1",tenant_id:"north",device_id:registration.device_id,public_key:registration.public_key,public_key_fingerprint:registration.public_key_fingerprint,sources:["orders"],abilities:["mutate","sync"],issued_at:exactInstant(now-60000),expires_at:exactInstant(now+86400000),key_id:"credential",signature:"0".repeat(64)},unsigned={actor_id:"Browser:1",tenant_id:"north",device_id:registration.device_id,public_key:registration.public_key,public_key_fingerprint:registration.public_key_fingerprint,sources:["orders"],abilities:["mutate","sync"],issued_at:credential.issued_at,expires_at:credential.expires_at,key_id:"credential"};credential.credential_id="lfc_"+(await ordinaryDigest(unsigned)).slice(0,48);return credential;}
